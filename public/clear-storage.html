<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Storage - Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .clear-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-color);
        }
        
        .clear-card {
            background: white;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: var(--shadow-hover);
            max-width: 500px;
            text-align: center;
        }
        
        .clear-card h1 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        
        .clear-card p {
            color: var(--gray-color);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .info-box {
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            text-align: left;
        }
        
        .info-box h3 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }
        
        .info-box p {
            margin: 0.25rem 0;
            font-size: 0.9rem;
        }
        
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        
        .btn-admin {
            background: var(--primary-color);
            color: white;
        }
        
        .btn-admin:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        .btn-user {
            background: #3498db;
            color: white;
        }
        
        .btn-user:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        
        .btn-home {
            background: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }
        
        .btn-home:hover {
            background: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body>
    <div class="clear-container">
        <div class="clear-card">
            <h1>🔧 Storage Management</h1>
            <p>Manage your local storage data and test different user roles.</p>
            
            <div class="info-box">
                <h3>Current Status:</h3>
                <p><strong>Logged In:</strong> <span id="loginStatus">-</span></p>
                <p><strong>User Role:</strong> <span id="userRole">-</span></p>
                <p><strong>Email:</strong> <span id="userEmail">-</span></p>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-danger" onclick="clearAllStorage()">
                    <i class="fas fa-trash"></i> Clear All Data
                </button>
                
                <button class="btn btn-admin" onclick="setAdmin()">
                    <i class="fas fa-shield-alt"></i> Set as Admin
                </button>
                
                <button class="btn btn-user" onclick="setUser()">
                    <i class="fas fa-user"></i> Set as User
                </button>
                
                <button class="btn btn-home" onclick="goHome()">
                    <i class="fas fa-home"></i> Go Home
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Display current status
        function updateStatus() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const userRole = localStorage.getItem('userRole') || 'none';
            const userEmail = localStorage.getItem('userEmail') || 'none';
            
            document.getElementById('loginStatus').textContent = isLoggedIn ? '✅ Yes' : '❌ No';
            document.getElementById('userRole').textContent = userRole;
            document.getElementById('userEmail').textContent = userEmail;
        }
        
        // Clear all storage
        function clearAllStorage() {
            if (confirm('Clear all local storage data? This will log you out and reset everything.')) {
                localStorage.clear();
                alert('✅ All data cleared!');
                updateStatus();
            }
        }
        
        // Set as admin
        function setAdmin() {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userRole', 'admin');
            localStorage.setItem('userEmail', 'admin@restaurant.com');
            localStorage.setItem('userName', 'Admin User');
            alert('✅ Set as Admin! Reloading page...');
            setTimeout(() => window.location.reload(), 500);
        }
        
        // Set as regular user
        function setUser() {
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userRole', 'user');
            localStorage.setItem('userEmail', 'user@example.com');
            localStorage.setItem('userName', 'Regular User');
            alert('✅ Set as Regular User! Reloading page...');
            setTimeout(() => window.location.reload(), 500);
        }
        
        // Go to home page
        function goHome() {
            window.location.href = 'index.html';
        }
        
        // Update status on load
        updateStatus();
    </script>
</body>
</html>
