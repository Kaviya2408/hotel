<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Delicious Restaurant</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<section class="container mt-5">
    <h2 class="text-center mb-4">Your Cart</h2>

    <div id="cart-content"></div>

    <div id="cart-summary" style="display:none;">
        <h4>Subtotal: $<span id="subtotal">0</span></h4>
        <h4>Total (Including $5 Delivery): $<span id="total">0</span></h4>

        <button class="btn btn-primary mt-3" onclick="showPlaceOrderModal()">
            Place Order
        </button>
    </div>
</section>

<!-- Modal -->
<div class="modal fade" id="placeOrderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Order</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <ul id="modalOrderItems"></ul>
                <p><strong>Total: $<span id="modalTotalAmount">0</span></strong></p>

                <form id="order-form">
                    <input type="text" id="name" class="form-control mb-2" placeholder="Name" required>
                    <input type="email" id="email" class="form-control mb-2" placeholder="Email" required>
                    <input type="tel" id="phone" class="form-control mb-2" placeholder="Phone" required>
                    <textarea id="address" class="form-control mb-2" placeholder="Address" required></textarea>

                    <button type="submit" class="btn btn-success w-100">
                        Confirm Order
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];

function renderCart() {
    const cartContent = document.getElementById('cart-content');
    const cartSummary = document.getElementById('cart-summary');

    if (cart.length === 0) {
        cartContent.innerHTML = "<p>Your cart is empty.</p>";
        cartSummary.style.display = 'none';
        return;
    }

    let html = "";
    let subtotal = 0;

    cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;

        html += `
            <div class="border p-3 mb-2">
                <strong>${item.name}</strong><br>
                $${item.price} x ${item.quantity}
            </div>
        `;
    });

    cartContent.innerHTML = html;

    const total = subtotal + 5;

    document.getElementById('subtotal').textContent = subtotal.toFixed(2);
    document.getElementById('total').textContent = total.toFixed(2);

    cartSummary.style.display = 'block';
}

function showPlaceOrderModal() {
    const modalItems = document.getElementById('modalOrderItems');
    const modalTotal = document.getElementById('modalTotalAmount');

    modalItems.innerHTML = '';
    let subtotal = 0;

    cart.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.name} - $${item.price} x ${item.quantity}`;
        modalItems.appendChild(li);
        subtotal += item.price * item.quantity;
    });

    modalTotal.textContent = (subtotal + 5).toFixed(2);

    new bootstrap.Modal(document.getElementById('placeOrderModal')).show();
}

document.getElementById('order-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const orderData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        items: cart,
        total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0) + 5
    };

    try {
        const response = await fetch('https://restaurant-backend-0vmh.onrender.com/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
        });

        if (!response.ok) throw new Error("Server error");

        await response.json();

        alert("Order placed successfully!");

        cart = [];
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();

        bootstrap.Modal.getInstance(document.getElementById('placeOrderModal')).hide();

    } catch (error) {
        console.error(error);
        alert("Failed to place order");
    }
});

renderCart();
</script>

</body>
</html>
