<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Delicious Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .cart-page { padding: 60px 0; min-height: 60vh; }
        .cart-container { max-width: 900px; margin: 0 auto; }
        .cart-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            padding: 2rem;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }
        .cart-items { background: var(--white); padding: 2rem; }
        .cart-item {
            display: flex;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid #e0e0e0;
            gap: 1rem;
        }
        .item-info { flex: 1; }
        .item-name { font-weight: 600; font-size: 1.1rem; margin-bottom: 0.5rem; }
        .item-price { color: var(--gray-color); }
        .quantity-controls { display: flex; align-items: center; gap: 1rem; }
        .quantity-btn {
            background: var(--primary-color);
            color: var(--white);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
        }
        .quantity-btn:hover { background: var(--secondary-color); }
        .quantity { font-weight: 600; min-width: 40px; text-align: center; }
        .item-total {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary-color);
            min-width: 100px;
            text-align: right;
        }
        .remove-btn {
            background: #dc3545;
            color: var(--white);
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
        }
        .cart-summary {
            background: var(--light-gray);
            padding: 2rem;
            border-radius: 0 0 12px 12px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
        .summary-total {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary-color);
            padding-top: 1rem;
            border-top: 2px solid var(--primary-color);
        }
        .empty-cart {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--white);
        }
        .empty-cart i {
            font-size: 4rem;
            color: var(--gray-color);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="nav-wrapper">
            <div class="logo">
                <img src="logo.png" alt="Restaurant Logo">
                <span>Delicious</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html" class="cart-link active">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="cart-page">
    <div class="container">
        <div class="cart-container">
            <div class="cart-header">
                <h1><i class="fas fa-shopping-cart"></i> Your Shopping Cart</h1>
            </div>
            
            <div id="cart-content"></div>
            
            <div class="cart-summary" id="cart-summary" style="display: none;">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0</span>
                </div>
                <div class="summary-row">
                    <span>Delivery Fee:</span>
                    <span>$5.00</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Total:</span>
                    <span id="total">$0</span>
                </div>
                <button class="btn-primary" onclick="showPlaceOrderModal()" style="width: 100%; margin-top: 1.5rem;">
                    <i class="fas fa-check-circle"></i> Place Order
                </button>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="placeOrderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Your Order</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Your order contains:</p>
                <ul id="modalOrderItems"></ul>
                <p><strong>Total Amount: $<span id="modalTotalAmount">0</span></strong></p>
                <hr>
                <form id="order-form">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Delivery Address</label>
                        <textarea class="form-control" id="address" rows="3" required></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Confirm Order</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];

function renderCart() {
    const cartContent = document.getElementById('cart-content');
    const cartSummary = document.getElementById('cart-summary');
    
    if (cart.length === 0) {
        cartContent.innerHTML = `
            <div class="empty-cart">
                <i class="fas fa-shopping-cart"></i>
                <h3>Your cart is empty</h3>
                <p>Add some delicious items from our menu!</p>
            </div>
        `;
        cartSummary.style.display = 'none';
        return;
    }
    
    let html = '<div class="cart-items">';
    let subtotal = 0;
    
    cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;
        
        html += `
            <div class="cart-item">
                <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">$${item.price.toFixed(2)} each</div>
                </div>
                <div class="quantity-controls">
                    <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">-</button>
                    <span class="quantity">${item.quantity}</span>
                    <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                </div>
                <div class="item-total">$${itemTotal.toFixed(2)}</div>
                <button class="remove-btn" onclick="removeItem(${index})">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `;
    });
    
    html += '</div>';
    cartContent.innerHTML = html;
    
    const total = subtotal + 5.00;
    
    document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
    document.getElementById('total').textContent = `$${total.toFixed(2)}`;
    cartSummary.style.display = 'block';
}

function updateQuantity(index, change) {
    cart[index].quantity += change;
    if (cart[index].quantity <= 0) cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

function showPlaceOrderModal() {
    const modalOrderItems = document.getElementById('modalOrderItems');
    const modalTotalAmount = document.getElementById('modalTotalAmount');
    
    modalOrderItems.innerHTML = '';
    let subtotal = 0;
    
    cart.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.name} - $${item.price} x ${item.quantity}`;
        modalOrderItems.appendChild(li);
        subtotal += item.price * item.quantity;
    });
    
    modalTotalAmount.textContent = (subtotal + 5).toFixed(2);
    new bootstrap.Modal(document.getElementById('placeOrderModal')).show();
}

document.getElementById('order-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    if (!cart || cart.length === 0) {
        alert("Cart is empty!");
        return;
    }
    
    const orderData = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        address: document.getElementById("address").value.trim(),
        items: cart,
        total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0) + 5
    };
    
    try {
        const response = await fetch("https://restaurant-backend-0vmh.onrender.com/api/orders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(orderData)
        });
        
        const data = await response.json();
        
        if (!response.ok) {
            console.error("Server error:", data);
            alert("Failed to place order");
            return;
        }
        
        alert("Order placed successfully!");
        
        cart = [];
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
        
        const modalElement = document.getElementById("placeOrderModal");
        if (modalElement) {
            const modal = bootstrap.Modal.getInstance(modalElement);
            if (modal) modal.hide();
        }
        
    } catch (error) {
        console.error("Fetch error:", error);
        alert("Failed to place order");
    }
});

renderCart();
</script>

<script src="script.js"></script>
</body>
</html>
