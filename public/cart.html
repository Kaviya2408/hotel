<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shopping Cart - Delicious Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --dark-color: #2c3e50;
            --light-gray: #f8f9fa;
            --white: #ffffff;
            --gray-color: #6c757d;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--dark-color);
            background: var(--light-gray);
            overflow-x: hidden;
        }
        
        /* Mobile First Responsive Design */
        .cart-page {
            padding: 80px 0 20px 0;
            min-height: 60vh;
        }
        
        .cart-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        .cart-header {
            background: var(--primary-color);
            color: var(--white);
            padding: 2rem 1rem;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }
        
        .cart-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        
        .cart-items {
            background: var(--white);
            padding: 1rem;
        }
        
        .cart-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 1rem 0;
            border-bottom: 1px solid #e0e0e0;
            gap: 1rem;
        }
        
        .item-info {
            flex: 1;
            width: 100%;
        }
        
        .item-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }
        
        .item-price {
            color: var(--gray-color);
            font-size: 0.9rem;
        }
        
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            justify-content: space-between;
        }
        
        .quantity-btn {
            background: var(--primary-color);
            color: var(--white);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .quantity-btn:hover {
            background: #e55555;
        }
        
        .quantity {
            font-weight: 600;
            min-width: 40px;
            text-align: center;
            font-size: 1rem;
        }
        
        .item-total {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary-color);
            align-self: flex-end;
        }
        
        .remove-btn {
            background: #dc3545;
            color: var(--white);
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        
        .cart-summary {
            background: var(--light-gray);
            padding: 1.5rem;
            border-radius: 0 0 12px 12px;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 1rem;
        }
        
        .summary-total {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--primary-color);
            padding-top: 1rem;
            border-top: 2px solid var(--primary-color);
        }
        
        .empty-cart {
            text-align: center;
            padding: 3rem 1rem;
            background: var(--white);
            border-radius: 12px;
        }
        
        .empty-cart i {
            font-size: 3rem;
            color: var(--gray-color);
            margin-bottom: 1rem;
        }
        
        .empty-cart h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        
        .empty-cart p {
            font-size: 0.9rem;
            color: var(--gray-color);
        }
        
        /* Modal Responsive */
        .modal-dialog {
            margin: 1rem;
            max-width: calc(100% - 2rem);
        }
        
        .modal-body {
            padding: 1.5rem 1rem;
        }
        
        .form-label {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .form-control {
            font-size: 0.9rem;
            padding: 0.75rem;
        }
        
        /* Buttons */
        .btn-primary {
            background: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: #e55555;
            transform: translateY(-2px);
        }
        
        /* Tablet and Desktop */
        @media (min-width: 768px) {
            .cart-page {
                padding: 100px 0 40px 0;
            }
            
            .cart-container {
                padding: 0 2rem;
            }
            
            .cart-header {
                padding: 3rem 2rem;
            }
            
            .cart-header h1 {
                font-size: 2rem;
            }
            
            .cart-items {
                padding: 2rem;
            }
            
            .cart-item {
                flex-direction: row;
                align-items: center;
                gap: 1rem;
            }
            
            .item-info {
                flex: 1;
                width: auto;
            }
            
            .item-name {
                font-size: 1.1rem;
            }
            
            .item-price {
                font-size: 1rem;
            }
            
            .quantity-controls {
                width: auto;
            }
            
            .item-total {
                font-size: 1.2rem;
                align-self: auto;
            }
            
            .remove-btn {
                margin-top: 0;
            }
            
            .cart-summary {
                padding: 2rem;
            }
            
            .summary-row {
                font-size: 1.1rem;
            }
            
            .summary-total {
                font-size: 1.5rem;
            }
            
            .empty-cart {
                padding: 4rem 2rem;
            }
            
            .empty-cart i {
                font-size: 4rem;
            }
            
            .empty-cart h3 {
                font-size: 1.5rem;
            }
            
            .empty-cart p {
                font-size: 1rem;
            }
        }
        
        /* Large Desktop */
        @media (min-width: 1200px) {
            .cart-container {
                padding: 0;
            }
        }
        
        /* Prevent zoom on input focus (iOS) */
        @supports (-webkit-touch-callout: none) {
            .form-control {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="nav-wrapper">
            <div class="logo">
                <img src="logo.png" alt="Restaurant Logo">
                <span>Delicious</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html" class="cart-link active">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a></li>
            </ul>
        </div>
    </div>
</nav>

<section class="cart-page">
    <div class="container">
        <div class="cart-container">
            <div class="cart-header">
                <h1><i class="fas fa-shopping-cart"></i> Your Shopping Cart</h1>
            </div>
            
            <div id="cart-content"></div>
            
            <div class="cart-summary" id="cart-summary" style="display: none;">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0</span>
                </div>
                <div class="summary-row">
                    <span>Delivery Fee:</span>
                    <span>$5.00</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Total:</span>
                    <span id="total">$0</span>
                </div>
                <button class="btn-primary" onclick="showPlaceOrderModal()" style="width: 100%; margin-top: 1.5rem;">
                    <i class="fas fa-check-circle"></i> Place Order
                </button>
            </div>
        </div>
    </div>
</section>

<div class="modal fade" id="placeOrderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Your Order</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Your order contains:</p>
                <ul id="modalOrderItems"></ul>
                <p><strong>Total Amount: $<span id="modalTotalAmount">0</span></strong></p>
                <hr>
                <form id="order-form">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Delivery Address</label>
                        <textarea class="form-control" id="address" rows="3" required></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Confirm Order</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];

function renderCart() {
    const cartContent = document.getElementById('cart-content');
    const cartSummary = document.getElementById('cart-summary');
    
    if (cart.length === 0) {
        cartContent.innerHTML = `
            <div class="empty-cart">
                <i class="fas fa-shopping-cart"></i>
                <h3>Your cart is empty</h3>
                <p>Add some delicious items from our menu!</p>
            </div>
        `;
        cartSummary.style.display = 'none';
        return;
    }
    
    let html = '<div class="cart-items">';
    let subtotal = 0;
    
    cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;
        
        html += `
            <div class="cart-item">
                <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">$${item.price.toFixed(2)} each</div>
                </div>
                <div class="quantity-controls">
                    <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">-</button>
                    <span class="quantity">${item.quantity}</span>
                    <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                </div>
                <div class="item-total">$${itemTotal.toFixed(2)}</div>
                <button class="remove-btn" onclick="removeItem(${index})">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `;
    });
    
    html += '</div>';
    cartContent.innerHTML = html;
    
    const total = subtotal + 5.00;
    
    document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
    document.getElementById('total').textContent = `$${total.toFixed(2)}`;
    cartSummary.style.display = 'block';
}

function updateQuantity(index, change) {
    cart[index].quantity += change;
    if (cart[index].quantity <= 0) cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
}

function showPlaceOrderModal() {
    const modalOrderItems = document.getElementById('modalOrderItems');
    const modalTotalAmount = document.getElementById('modalTotalAmount');
    
    modalOrderItems.innerHTML = '';
    let subtotal = 0;
    
    cart.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.name} - $${item.price} x ${item.quantity}`;
        modalOrderItems.appendChild(li);
        subtotal += item.price * item.quantity;
    });
    
    modalTotalAmount.textContent = (subtotal + 5).toFixed(2);
    new bootstrap.Modal(document.getElementById('placeOrderModal')).show();
}

document.getElementById('order-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    if (!cart || cart.length === 0) {
        alert("Cart is empty!");
        return;
    }
    
    const orderData = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        address: document.getElementById("address").value.trim(),
        items: cart,
        total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0) + 5
    };
    
    try {
        const response = await fetch("https://restaurant-backend-0vmh.onrender.com/api/orders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(orderData)
        });
        
        const data = await response.json();
        
        if (!response.ok) {
            console.error("Server error:", data);
            alert("Failed to place order");
            return;
        }
        
        alert("Order placed successfully!");
        
        cart = [];
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
        
        const modalElement = document.getElementById("placeOrderModal");
        if (modalElement) {
            const modal = bootstrap.Modal.getInstance(modalElement);
            if (modal) modal.hide();
        }
        
    } catch (error) {
        console.error("Fetch error:", error);
        alert("Failed to place order");
    }
});

renderCart();
</script>

<script src="script.js"></script>
</body>
</html>
