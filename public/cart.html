<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Shopping Cart - Delicious Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Reset body padding for cart page */
        body {
            padding-top: 0 !important;
            margin: 0 !important;
        }
        
        /* Cart Page Specific Styles */
        .cart-page {
            padding: 90px 0 20px 0;
            min-height: calc(100vh - 90px);
        }
        
        .cart-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 15px;
            position: relative;
            z-index: 1;
        }
        
        .cart-header {
            background: var(--primary-color);
            color: var(--white);
            padding: 1rem 1rem;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }
        
        .cart-header h1 {
            font-size: 1.3rem;
            margin-bottom: 0;
        }
        
        .cart-items {
            background: var(--white);
            padding: 0.75rem;
            position: relative;
            z-index: 10;
            max-height: calc(100vh - 450px);
            overflow-y: auto;
        }
        
        .cart-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0.75rem 0;
            border-bottom: 1px solid #e0e0e0;
            gap: 0.75rem;
            position: relative;
            z-index: 10;
        }
        
        .item-info {
            flex: 1;
            width: 100%;
        }
        
        .item-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }
        
        .item-price {
            color: var(--gray-color);
            font-size: 0.85rem;
        }
        
        .cart-item-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 1rem;
        }
        
        .quantity-controls {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .quantity-btn {
            background: var(--primary-color);
            color: var(--white);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        
        .quantity-btn:hover {
            background: var(--secondary-color);
            transform: scale(1.1);
        }
        
        .quantity {
            font-weight: 600;
            min-width: 35px;
            text-align: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            color: var(--dark-color);
        }
        
        .item-total {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary-color);
            align-self: flex-end;
        }
        
        .remove-btn {
            background: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        
        .cart-summary {
            background: var(--light-gray);
            padding: 1rem;
            border-radius: 0 0 12px 12px;
            display: block !important;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        
        .summary-total {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary-color);
            padding-top: 0.75rem;
            border-top: 2px solid var(--primary-color);
        }
        
        .empty-cart {
            text-align: center;
            padding: 3rem 1rem;
            background: var(--white);
            border-radius: 12px;
        }
        
        .empty-cart i {
            font-size: 3rem;
            color: var(--gray-color);
            margin-bottom: 1rem;
        }
        
        .empty-cart h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        
        .empty-cart p {
            font-size: 0.9rem;
            color: var(--gray-color);
        }
        
        .modal {
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .modal.show {
            display: flex !important;
        }

        .modal-dialog {
            margin: 1rem auto;
            max-width: 500px;
            width: calc(100% - 2rem);
        }
        
        .modal-content {
            border-radius: 12px;
            border: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .modal-body {
            padding: 1.5rem 1rem;
        }
        
        .form-label {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .form-control {
            font-size: 0.9rem;
            padding: 0.75rem;
        }
        
        .btn-primary {
            background: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        @media (min-width: 768px) {
            .cart-page {
                padding: 120px 0 40px 0;
            }
            
            .cart-container {
                padding: 0 2rem;
            }
            
            .cart-header {
                padding: 2rem;
            }
            
            .cart-header h1 {
                font-size: 2rem;
            }
            
            .cart-items {
                padding: 2rem;
            }
            
            .cart-item {
                flex-direction: row;
                align-items: center;
                gap: 1rem;
            }
            
            .item-info {
                flex: 1;
                width: auto;
            }
            
            .item-name {
                font-size: 1.1rem;
            }
            
            .item-price {
                font-size: 1rem;
            }
            
            .cart-item-actions {
                width: auto;
                gap: 1.5rem;
            }
            
            .quantity-controls {
                width: auto;
            }
            
            .item-total {
                font-size: 1.2rem;
                align-self: auto;
            }
            
            .remove-btn {
                margin-top: 0;
            }
            
            .cart-summary {
                padding: 2rem;
            }
            
            .summary-row {
                font-size: 1.1rem;
            }
            
            .summary-total {
                font-size: 1.5rem;
            }
            
            .modal-dialog {
                max-width: 600px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="loader">
            <div class="food-plate">
                <div class="food-items">
                    <span class="food-item">🍛</span>
                    <span class="food-item">🥘</span>
                    <span class="food-item">🌯</span>
                    <span class="food-item">🍜</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <div class="logo">
                    <img src="logo.png" alt="Restaurant Logo">
                    <span>Delicious</span>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="cart.html" class="cart-link active">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count">0</span>
                    </a></li>
                </ul>
                <div class="nav-actions">
                    <div id="authButtons">
                        <div class="user-menu">
                            <button class="user-btn" id="userMenuBtn">
                                <i class="fas fa-user-circle"></i>
                            </button>
                            <div class="user-dropdown" id="userDropdown">
                                <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
                                <a href="admin.html" id="adminPanelLink" style="display:none;"><i class="fas fa-shield-alt"></i> Admin Panel</a>
                                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                            </div>
                        </div>
                    </div>
                    <button class="menu-toggle" id="menuToggle">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <section class="cart-page">
        <div class="container">
            <div class="cart-container">
                <div class="cart-header">
                    <h1><i class="fas fa-shopping-cart"></i> Your Shopping Cart</h1>
                </div>
                
                <div id="cart-content"></div>
                
                <div class="cart-summary" id="cart-summary" style="display: none;">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Delivery Fee:</span>
                        <span>$5.00</span>
                    </div>
                    <div class="summary-row summary-total">
                        <span>Total:</span>
                        <span id="total">$5.00</span>
                    </div>
                    <button class="btn-primary" onclick="showPlaceOrderModal()" style="width: 100%; margin-top: 1.5rem;">
                        <i class="fas fa-check-circle"></i> Place Order
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Order Confirmation Modal -->
    <div class="modal fade" id="placeOrderModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Your Order</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Your order contains:</strong></p>
                    <ul id="modalOrderItems" style="margin-bottom: 1rem;"></ul>
                    <p><strong>Total Amount: <span id="modalTotalAmount">$0.00</span></strong></p>
                    <hr>
                    <form id="order-form">
                        <div class="mb-3">
                            <label class="form-label">Name <span style="color:red;">*</span></label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email <span style="color:red;">*</span></label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number <span style="color:red;">*</span></label>
                            <input type="tel" class="form-control" id="phone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Delivery Address <span style="color:red;">*</span></label>
                            <textarea class="form-control" id="address" rows="3" required></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" style="flex:1;">Cancel</button>
                            <button type="submit" class="btn btn-primary" style="flex:1;">Confirm Order</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const backendUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3002'
            : 'https://restaurant-backend-0vmh.onrender.com';

        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function renderCart() {
            const cartContent = document.getElementById('cart-content');
            const cartSummary = document.getElementById('cart-summary');
            
            if (!cartContent) {
                console.error('cart-content element not found!');
                return;
            }
            
            if (cart.length === 0) {
                cartContent.innerHTML = '<div class="empty-cart"><i class="fas fa-shopping-cart"></i><h3>Your cart is empty</h3><p>Add some delicious items from our menu!</p></div>';
                if (cartSummary) cartSummary.style.display = 'none';
                updateCartCount();
                return;
            }
            
            let html = '<div class="cart-items">';
            let subtotal = 0;
            
            cart.forEach((item, index) => {
                const price = typeof item.price === 'string' ? parseFloat(item.price.replace('$', '').replace(',', '')) : parseFloat(item.price);
                
                if (isNaN(price)) {
                    console.error('Invalid price for item:', item);
                    return;
                }
                
                const itemTotal = price * item.quantity;
                subtotal += itemTotal;
                
                html += `
                    <div class="cart-item">
                        <div class="item-info">
                            <div class="item-name">${item.name}</div>
                            <div class="item-price">$${price.toFixed(2)} each</div>
                        </div>
                        <div class="cart-item-actions">
                            <div class="quantity-controls">
                                <button type="button" class="quantity-btn" onclick="updateQuantity(${index}, -1)">-</button>
                                <span class="quantity">${item.quantity}</span>
                                <button type="button" class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                            </div>
                            <div class="item-total">$${itemTotal.toFixed(2)}</div>
                            <button type="button" class="remove-btn" onclick="removeItem(${index})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            cartContent.innerHTML = html;
            
            const total = subtotal + 5.00;
            
            document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
            document.getElementById('total').textContent = '$' + total.toFixed(2);
            if (cartSummary) cartSummary.style.display = 'block';
            updateCartCount();
        }

        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function removeItem(index) {
            if (confirm('Remove this item from cart?')) {
                cart.splice(index, 1);
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            }
        }

        function updateCartCount() {
            const cartCount = document.querySelector('.cart-count');
            if (cartCount) {
                const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
                cartCount.textContent = totalItems;
            }
        }

        function showPlaceOrderModal() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            const modalOrderItems = document.getElementById('modalOrderItems');
            const modalTotalAmount = document.getElementById('modalTotalAmount');
            
            modalOrderItems.innerHTML = '';
            let subtotal = 0;
            
            cart.forEach(item => {
                const price = typeof item.price === 'string' ? parseFloat(item.price.replace('$', '').replace(',', '')) : parseFloat(item.price);
                const li = document.createElement('li');
                li.textContent = `${item.name} - $${price.toFixed(2)} x ${item.quantity} = $${(price * item.quantity).toFixed(2)}`;
                modalOrderItems.appendChild(li);
                subtotal += price * item.quantity;
            });
            
            const total = subtotal + 5.00;
            modalTotalAmount.textContent = '$' + total.toFixed(2);
            
            const modal = new bootstrap.Modal(document.getElementById('placeOrderModal'));
            modal.show();
        }

        // Form submission handler
        document.getElementById('order-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!cart || cart.length === 0) {
                alert("Cart is empty!");
                return;
            }
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            
            const orderData = {
                name: document.getElementById("name").value.trim(),
                email: document.getElementById("email").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                address: document.getElementById("address").value.trim(),
                items: cart,
                total: cart.reduce((sum, item) => {
                    const price = typeof item.price === 'string' ? parseFloat(item.price.replace('$', '').replace(',', '')) : parseFloat(item.price);
                    return sum + (price * item.quantity);
                }, 0) + 5.00
            };
            
            console.log('Submitting order:', orderData);
            
            try {
                const response = await fetch(`${backendUrl}/api/orders`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(orderData)
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    console.error("Server error:", data);
                    alert("Failed to place order: " + (data.error || response.statusText));
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Confirm Order';
                    return;
                }
                
                alert("✅ Order placed successfully! Your order number is: " + data.order._id);
                
                // Clear cart
                cart = [];
                localStorage.setItem("cart", JSON.stringify(cart));
                
                // Close modal
                const modalElement = document.getElementById("placeOrderModal");
                const modal = bootstrap.Modal.getInstance(modalElement);
                if (modal) modal.hide();
                
                // Reset form
                document.getElementById('order-form').reset();
                
                // Re-render cart
                renderCart();
                
            } catch (error) {
                console.error("Fetch error:", error);
                alert("Failed to place order. Please check your connection and try again.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Confirm Order';
            }
        });

        // Make functions global
        window.updateQuantity = updateQuantity;
        window.removeItem = removeItem;
        window.showPlaceOrderModal = showPlaceOrderModal;

        // Initialize
        renderCart();
    </script>

    <script src="script.js"></script>
</body>
</html>
