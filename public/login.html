<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - Delicious Restaurant</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
	<style>
		body {
			background: var(--bg-color);
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100vh;
			margin: 0;
			padding: 0;
			position: relative;
			overflow: hidden;
		}
		.floating-food {
			position: absolute;
			font-size: 3rem;
			opacity: 0.3;
			animation: float 20s infinite ease-in-out;
			pointer-events: none;
		}
		.floating-food:nth-child(1) {
			top: 10%;
			left: 10%;
			animation-delay: 0s;
		}
		.floating-food:nth-child(2) {
			top: 20%;
			right: 15%;
			animation-delay: 2s;
		}
		.floating-food:nth-child(3) {
			bottom: 15%;
			left: 15%;
			animation-delay: 4s;
		}
		.floating-food:nth-child(4) {
			bottom: 20%;
			right: 10%;
			animation-delay: 6s;
		}
		.floating-food:nth-child(5) {
			top: 50%;
			left: 5%;
			animation-delay: 8s;
		}
		.floating-food:nth-child(6) {
			top: 60%;
			right: 5%;
			animation-delay: 10s;
		}
		.floating-food:nth-child(7) {
			top: 35%;
			left: 25%;
			animation-delay: 3s;
			font-size: 2.5rem;
		}
		.floating-food:nth-child(8) {
			top: 70%;
			right: 25%;
			animation-delay: 5s;
			font-size: 2.5rem;
		}
		.floating-food:nth-child(9) {
			bottom: 40%;
			left: 8%;
			animation-delay: 7s;
			font-size: 2rem;
		}
		.floating-food:nth-child(10) {
			top: 80%;
			right: 20%;
			animation-delay: 9s;
			font-size: 2rem;
		}
		@keyframes float {
			0%, 100% {
				transform: translateY(0) rotate(0deg);
			}
			25% {
				transform: translateY(-30px) rotate(5deg);
			}
			50% {
				transform: translateY(-60px) rotate(-5deg);
			}
			75% {
				transform: translateY(-30px) rotate(3deg);
			}
		}
		.login-container {
			background: var(--white);
			padding: 2.5rem;
			border-radius: 16px;
			box-shadow: var(--shadow-hover);
			max-width: 450px;
			width: 90%;
			max-height: 85vh;
			position: relative;
			z-index: 1;
			margin: auto;
			overflow-y: auto;
		}
		.login-container::-webkit-scrollbar {
			width: 8px;
		}
		.login-container::-webkit-scrollbar-track {
			background: #f1f1f1;
			border-radius: 10px;
		}
		.login-container::-webkit-scrollbar-thumb {
			background: var(--primary-color);
			border-radius: 10px;
		}
		.login-container::-webkit-scrollbar-thumb:hover {
			background: var(--secondary-color);
		}
		.login-header {
			text-align: center;
			margin-bottom: 2rem;
		}
		.login-logo {
			width: 70px;
			height: 70px;
			margin: 0 auto 1rem;
		}
		.login-logo img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			filter: sepia(100%) saturate(300%) hue-rotate(330deg) brightness(0.8);
		}
		.login-header h1 {
			font-size: 2rem;
			color: var(--primary-color);
			margin-bottom: 0.5rem;
		}
		.login-header p {
			color: var(--gray-color);
			font-size: 0.95rem;
		}
		.form-group {
			margin-bottom: 1.5rem;
		}
		.form-group label {
			display: block;
			margin-bottom: 0.5rem;
			font-weight: 600;
			color: var(--dark-color);
		}
		.form-group input {
			width: 100%;
			padding: 12px;
			border: 2px solid #e0e0e0;
			border-radius: 8px;
			font-size: 1rem;
			transition: var(--transition);
			box-sizing: border-box;
		}
		.form-group input:focus {
			outline: none;
			border-color: var(--primary-color);
		}
		.btn-login {
			width: 100%;
			padding: 14px;
			background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
			color: var(--white);
			border: none;
			border-radius: 8px;
			font-size: 1rem;
			font-weight: 600;
			cursor: pointer;
			transition: var(--transition);
		}
		.btn-login:hover {
			transform: translateY(-2px);
			box-shadow: var(--shadow-hover);
		}
		.forgot-password {
			text-align: center;
			margin-top: 1rem;
		}
		.forgot-password a {
			color: var(--primary-color);
			text-decoration: none;
			font-size: 0.9rem;
			transition: var(--transition);
		}
		.forgot-password a:hover {
			color: var(--secondary-color);
		}
		.divider {
			text-align: center;
			margin: 2rem 0;
			position: relative;
		}
		.divider::before {
			content: '';
			position: absolute;
			top: 50%;
			left: 0;
			right: 0;
			height: 1px;
			background: #e0e0e0;
		}
		.divider span {
			background: var(--white);
			padding: 0 1rem;
			position: relative;
			color: var(--gray-color);
			font-size: 0.9rem;
		}
		.signup-link {
			text-align: center;
		}
		.signup-link p {
			color: var(--gray-color);
			margin-bottom: 1rem;
		}
		.btn-signup {
			width: 100%;
			padding: 14px;
			background: var(--white);
			color: var(--primary-color);
			border: 2px solid var(--primary-color);
			border-radius: 8px;
			font-size: 1rem;
			font-weight: 600;
			cursor: pointer;
			transition: var(--transition);
			text-decoration: none;
			display: block;
			text-align: center;
		}
		.btn-signup:hover {
			background: var(--primary-color);
			color: var(--white);
		}
		.back-home {
			text-align: center;
			margin-top: 1.5rem;
		}
		.back-home a {
			color: var(--gray-color);
			text-decoration: none;
			font-size: 0.9rem;
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
			transition: var(--transition);
		}
		.back-home a:hover {
			color: var(--primary-color);
		}
		#message-container {
			margin-bottom: 1rem;
		}
		.alert {
			padding: 12px;
			border-radius: 8px;
			margin-bottom: 1rem;
		}
		.alert-success {
			background: #d4edda;
			color: #155724;
			border: 1px solid #c3e6cb;
		}
		.alert-error {
			background: #f8d7da;
			color: #721c24;
			border: 1px solid #f5c6cb;
		}
	</style>
</head>
<body>
	<!-- Loading Screen -->
	<div class="loading-screen">
		<div class="loader">
			<div class="food-plate">
				<div class="food-items">
					<span class="food-item">🍛</span>
					<span class="food-item">🥘</span>
					<span class="food-item">🌯</span>
					<span class="food-item">🍜</span>
					<span class="food-item">🥙</span>
					<span class="food-item">🍲</span>
				</div>
			</div>
		</div>
	</div>

	<!-- Floating Food Decorations -->
	<div class="floating-food">🍛</div>
	<div class="floating-food">🥘</div>
	<div class="floating-food">🍜</div>
	<div class="floating-food">🌯</div>
	<div class="floating-food">🍲</div>
	<div class="floating-food">🥙</div>
	<div class="floating-food">🍕</div>
	<div class="floating-food">🍝</div>
	<div class="floating-food">🥗</div>
	<div class="floating-food">🍱</div>

	<div class="login-container">
		<div class="login-header">
			<div class="login-logo">
				<img src="logo.png" alt="Delicious Restaurant">
			</div>
			<h1>Welcome Back</h1>
			<p>Login to your account</p>
		</div>

		<div id="message-container"></div>

		<form onsubmit="handleLogin(event)">
			<div class="form-group">
				<label for="email">Email Address</label>
				<input type="email" id="email" name="email" required placeholder="Enter your email">
			</div>

			<div class="form-group">
				<label for="password">Password</label>
				<input type="password" id="password" name="password" required placeholder="Enter your password">
			</div>

			<button type="submit" class="btn-login">
				<i class="fas fa-sign-in-alt"></i> Login
			</button>
		</form>

		<div class="forgot-password">
			<a href="forgot-password.html">Forgot Password?</a>
		</div>

		<div class="divider">
			<span>OR</span>
		</div>

		<div class="signup-link">
			<p>Don't have an account?</p>
			<a href="signup.html" class="btn-signup">
				<i class="fas fa-user-plus"></i> Create Account
			</a>
		</div>

		<div class="back-home">
			<a href="index.html">
				<i class="fas fa-arrow-left"></i>
				Back to Home
			</a>
		</div>
	</div>

	<script>
		let firebaseConfig;
		let auth;

		// Load Firebase config securely from backend
		async function loadFirebaseConfig() {
			try {
				const response = await fetch('/api/firebase-config');
				firebaseConfig = await response.json();
				firebase.initializeApp(firebaseConfig);
				auth = firebase.auth();
			} catch (error) {
				console.error('Error loading Firebase config:', error);
			}
		}

		// Initialize Firebase when page loads
		loadFirebaseConfig();

		function handleLogin(event) {
			event.preventDefault();
			
			const email = document.getElementById('email').value;
			const password = document.getElementById('password').value;
			
			try {
				localStorage.setItem('userEmail', email);
				localStorage.setItem('isLoggedIn', 'true');
				localStorage.setItem('currentUser', JSON.stringify({
					name: email.split('@')[0],
					email: email
				}));
				
				showMessage('Login successful! Redirecting...', 'success');
				
				setTimeout(() => {
					window.location.href = 'index.html';
				}, 1500);
				
			} catch (error) {
				console.error('Login error:', error);
				showMessage('Login failed. Please try again.', 'error');
			}
		}

		function showMessage(message, type) {
			const messageContainer = document.getElementById('message-container');
			const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
			messageContainer.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
			
			setTimeout(() => {
				messageContainer.innerHTML = '';
			}, 5000);
		}
	</script>
	<script src="script.js"></script>
</body>
</html>
