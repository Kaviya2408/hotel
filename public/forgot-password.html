<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Delicious Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        body {
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            position: relative;
            overflow: hidden;
        }
        .floating-food {
            position: absolute;
            font-size: 3rem;
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
            pointer-events: none;
        }
        .floating-food:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        .floating-food:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-delay: 2s;
        }
        .floating-food:nth-child(3) {
            bottom: 15%;
            left: 15%;
            animation-delay: 4s;
        }
        .floating-food:nth-child(4) {
            bottom: 20%;
            right: 10%;
            animation-delay: 6s;
        }
        .floating-food:nth-child(5) {
            top: 50%;
            left: 5%;
            animation-delay: 8s;
        }
        .floating-food:nth-child(6) {
            top: 60%;
            right: 5%;
            animation-delay: 10s;
        }
        .floating-food:nth-child(7) {
            top: 35%;
            left: 25%;
            animation-delay: 3s;
            font-size: 2.5rem;
        }
        .floating-food:nth-child(8) {
            top: 70%;
            right: 25%;
            animation-delay: 5s;
            font-size: 2.5rem;
        }
        .floating-food:nth-child(9) {
            bottom: 40%;
            left: 8%;
            animation-delay: 7s;
            font-size: 2rem;
        }
        .floating-food:nth-child(10) {
            top: 80%;
            right: 20%;
            animation-delay: 9s;
            font-size: 2rem;
        }
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-30px) rotate(5deg);
            }
            50% {
                transform: translateY(-60px) rotate(-5deg);
            }
            75% {
                transform: translateY(-30px) rotate(3deg);
            }
        }
        .forgot-container {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: var(--shadow-hover);
            max-width: 450px;
            width: 90%;
            max-height: 85vh;
            position: relative;
            z-index: 1;
            margin: auto;
            overflow-y: auto;
        }
        .forgot-container::-webkit-scrollbar {
            width: 8px;
        }
        .forgot-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .forgot-container::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 10px;
        }
        .forgot-container::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }
        .forgot-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .forgot-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 2.5rem;
        }
        .forgot-header h1 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .forgot-header p {
            color: var(--gray-color);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--dark-color);
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .btn-reset {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .btn-reset:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .back-login {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-login a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }
        .back-login a:hover {
            color: var(--secondary-color);
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        #message-container {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="loader">
            <div class="food-plate">
                <div class="food-items">
                    <span class="food-item">🍛</span>
                    <span class="food-item">🥘</span>
                    <span class="food-item">🌯</span>
                    <span class="food-item">🍜</span>
                    <span class="food-item">🥙</span>
                    <span class="food-item">🍲</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Food Decorations -->
    <div class="floating-food">🍛</div>
    <div class="floating-food">🥘</div>
    <div class="floating-food">🍜</div>
    <div class="floating-food">🌯</div>
    <div class="floating-food">🍲</div>
    <div class="floating-food">🥙</div>
    <div class="floating-food">🍕</div>
    <div class="floating-food">🍝</div>
    <div class="floating-food">🥗</div>
    <div class="floating-food">🍱</div>

    <div class="forgot-container">
        <div class="forgot-header">
            <div class="forgot-icon">
                <i class="fas fa-key"></i>
            </div>
            <h1>Forgot Password?</h1>
            <p>No worries! Enter your email and we'll send you a reset link</p>
        </div>

        <div id="message-container"></div>

        <form onsubmit="handleForgotPassword(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your registered email">
            </div>

            <button type="submit" class="btn-reset" id="resetBtn">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>
        </form>

        <div class="back-login">
            <a href="login.html">
                <i class="fas fa-arrow-left"></i>
                Back to Login
            </a>
        </div>
    </div>

    <script>
        let firebaseConfig;

        // Load Firebase config securely from backend
        async function loadFirebaseConfig() {
            try {
                const response = await fetch('/api/firebase-config');
                firebaseConfig = await response.json();
                
                try {
                    firebase.initializeApp(firebaseConfig);
                } catch (error) {
                    console.log('Firebase already initialized');
                }
            } catch (error) {
                console.error('Error loading Firebase config:', error);
            }
        }

        // Initialize Firebase when page loads
        loadFirebaseConfig();

        const auth = firebase.auth();

        async function handleForgotPassword(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const resetBtn = document.getElementById('resetBtn');
            
            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

            try {
                await auth.sendPasswordResetEmail(email);
                
                showMessage('✅ Password reset link has been sent to your email! Please check your inbox.', 'success');
                document.getElementById('email').value = '';
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            } catch (error) {
                console.error('Reset password error:', error);
                let msg = 'Failed to send reset link. Please try again.';
                
                if (error.code === 'auth/user-not-found') {
                    msg = 'No account found with this email address.';
                } else if (error.code === 'auth/invalid-email') {
                    msg = 'Invalid email address.';
                } else if (error.code === 'auth/too-many-requests') {
                    msg = 'Too many requests. Please try again later.';
                }
                
                showMessage(msg, 'error');
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
            }
        }

        function showMessage(message, type) {
            const messageContainer = document.getElementById('message-container');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            messageContainer.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
            
            setTimeout(() => {
                messageContainer.innerHTML = '';
            }, 5000);
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
