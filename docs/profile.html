<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .floating-food {
            position: absolute;
            font-size: 3rem;
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
            pointer-events: none;
        }
        .floating-food:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }
        .floating-food:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-delay: 2s;
        }
        .floating-food:nth-child(3) {
            bottom: 15%;
            left: 15%;
            animation-delay: 4s;
        }
        .floating-food:nth-child(4) {
            bottom: 20%;
            right: 10%;
            animation-delay: 6s;
        }
        .floating-food:nth-child(5) {
            top: 50%;
            left: 5%;
            animation-delay: 8s;
        }
        .floating-food:nth-child(6) {
            top: 60%;
            right: 5%;
            animation-delay: 10s;
        }
        .floating-food:nth-child(7) {
            top: 35%;
            left: 25%;
            animation-delay: 3s;
            font-size: 2.5rem;
        }
        .floating-food:nth-child(8) {
            top: 70%;
            right: 25%;
            animation-delay: 5s;
            font-size: 2.5rem;
        }
        .floating-food:nth-child(9) {
            bottom: 40%;
            left: 8%;
            animation-delay: 7s;
            font-size: 2rem;
        }
        .floating-food:nth-child(10) {
            top: 80%;
            right: 20%;
            animation-delay: 9s;
            font-size: 2rem;
        }
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-30px) rotate(5deg);
            }
            50% {
                transform: translateY(-60px) rotate(-5deg);
            }
            75% {
                transform: translateY(-30px) rotate(3deg);
            }
        }
        .profile-card {
            background: var(--white);
            border-radius: 20px;
            box-shadow: var(--shadow-hover);
            padding: 40px;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(109, 76, 65, 0.1);
            position: relative;
            z-index: 1;
        }
        .profile-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            margin: 0 auto 20px;
            box-shadow: 0 8px 24px rgba(109, 76, 65, 0.3);
        }
        .profile-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark-color);
            margin: 0 0 8px;
        }
        .profile-email {
            font-size: 14px;
            color: var(--gray-color);
            margin: 0;
        }
        .role-badge {
            display: inline-block;
            background: rgba(179, 157, 219, 0.2);
            color: var(--accent-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin: 20px 0;
            border: 1px solid var(--accent-color);
        }
        .role-badge.admin {
            background: rgba(109, 76, 65, 0.1);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }
        .details-section {
            margin-top: 32px;
        }
        .details-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark-color);
            margin: 0 0 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .detail-item:last-child {
            border-bottom: none;
        }
        .detail-label {
            font-size: 13px;
            color: var(--gray-color);
            font-weight: 600;
            flex: 0 0 80px;
        }
        .detail-value {
            font-size: 13px;
            color: var(--dark-color);
            font-weight: 600;
            text-align: right;
            flex: 1;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .actions {
            margin-top: 32px;
            display: flex;
            gap: 12px;
        }
        .btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 12px rgba(109, 76, 65, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(109, 76, 65, 0.4);
        }
        .btn-secondary {
            background: var(--white);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }
        .btn-secondary:hover {
            background: var(--primary-color);
            color: var(--white);
        }
        .btn-admin {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 12px rgba(109, 76, 65, 0.3);
        }
        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(109, 76, 65, 0.4);
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="loader">
            <div class="food-plate">
                <div class="food-items">
                    <span class="food-item">🍛</span>
                    <span class="food-item">🥘</span>
                    <span class="food-item">🌯</span>
                    <span class="food-item">🍜</span>
                    <span class="food-item">🥙</span>
                    <span class="food-item">🍲</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Food Decorations -->
    <div class="floating-food">🍛</div>
    <div class="floating-food">🥘</div>
    <div class="floating-food">🍜</div>
    <div class="floating-food">🌯</div>
    <div class="floating-food">🍲</div>
    <div class="floating-food">🥙</div>
    <div class="floating-food">🍕</div>
    <div class="floating-food">🍝</div>
    <div class="floating-food">🥗</div>
    <div class="floating-food">🍱</div>

    <div class="profile-card">
        <div class="profile-header">
            <div class="avatar" id="avatar">U</div>
            <h1 class="profile-name" id="profile-name">Loading...</h1>
            <p class="profile-email" id="profile-email">Loading...</p>
            <div class="role-badge" id="role-badge">USER</div>
        </div>

        <div class="details-section">
            <h2 class="details-title">Account Details</h2>
            
            <div class="detail-item">
                <div class="detail-label">Role</div>
                <div class="detail-value" id="role-text">USER</div>
            </div>
            
            <div class="detail-item">
                <div class="detail-label">Name</div>
                <div class="detail-value" id="user-name">Loading...</div>
            </div>
            
            <div class="detail-item">
                <div class="detail-label">Email</div>
                <div class="detail-value" id="user-email">Loading...</div>
            </div>
            
            <div class="detail-item">
                <div class="detail-label">User ID</div>
                <div class="detail-value" id="user-id">Loading...</div>
            </div>
        </div>

        <div class="actions">
            <a href="index.html" class="btn btn-secondary">Home</a>
            <a href="admin.html" class="btn btn-admin" id="admin-btn" style="display: none;">Admin</a>
        </div>
    </div>

    <script>
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            window.location.href = 'login.html';
        } else {
            const user = JSON.parse(currentUser);
            
            // Update profile header
            const initial = (user.name || user.email || 'U').trim().charAt(0).toUpperCase();
            document.getElementById('avatar').textContent = initial;
            document.getElementById('profile-name').textContent = user.name || 'User';
            document.getElementById('profile-email').textContent = user.email || 'No email';
            
            // Update details
            document.getElementById('user-name').textContent = user.name || 'Not available';
            document.getElementById('user-email').textContent = user.email || 'Not available';
            document.getElementById('user-id').textContent = user.uid || 'Not available';
            
            // Update role
            const isAdmin = user.email === 'kit27.csbs29@gmail.com';
            const role = isAdmin ? 'ADMIN' : 'USER';
            document.getElementById('role-text').textContent = role;
            const roleBadge = document.getElementById('role-badge');
            roleBadge.textContent = role;
            if (isAdmin) {
                roleBadge.classList.add('admin');
            }
            
            // Show admin button for admin
            if (isAdmin) {
                document.getElementById('admin-btn').style.display = 'block';
            }
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
